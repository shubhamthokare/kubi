# ============================================================
# Kubi Local Dev — Nginx Reverse Proxy
# Replaces Minikube Ingress controller
#
# Domain:  kubi.kontactless.in
# Add to C:\Windows\System32\drivers\etc\hosts:
#   127.0.0.1  kubi.kontactless.in
#   127.0.0.1  backend.kubi.kontactless.in
#   127.0.0.1  agent.kubi.kontactless.in
#
# Routes (port 80):
#   kubi.kontactless.in/           -> Next.js dev server  (host:3001)
#   kubi.kontactless.in/auth/      -> FastAPI backend     (host:8000)
#   kubi.kontactless.in/api/       -> FastAPI backend     (host:8000)
#   kubi.kontactless.in/agent/     -> Agent service       (host:8080)
#   backend.kubi.kontactless.in/   -> FastAPI backend     (host:8000)
#   agent.kubi.kontactless.in/     -> Agent service       (host:8080)
# ============================================================

events {
    worker_connections 1024;
}

http {
    server_names_hash_bucket_size 128;

    # Docker embedded DNS resolver
    resolver 127.0.0.11 valid=5s;

    # --------------------------------------------------------
    # Upstream definitions (via host.docker.internal)
    # --------------------------------------------------------
    upstream frontend  { server host.docker.internal:3001; }
    upstream backend   { server host.docker.internal:8000; }
    upstream agent     { server host.docker.internal:8080; }
    upstream kibana_svc { server host.docker.internal:5601; }

    # --------------------------------------------------------
    # CORS macro — reused across all server blocks
    # Allowed origins match deploy/k8s/base/.env CORS_ORIGINS
    # --------------------------------------------------------
    map $http_origin $cors_origin {
        default                              "";
        "http://kubi.kontactless.in"         $http_origin;
        "http://backend.kubi.kontactless.in" $http_origin;
        "http://agent.kubi.kontactless.in"   $http_origin;
        "http://localhost"                   $http_origin;
        "http://localhost:3000"              $http_origin;
        "http://localhost:3001"              $http_origin;
        "http://localhost:8000"              $http_origin;
        "http://127.0.0.1:3000"             $http_origin;
        "http://127.0.0.1:3001"             $http_origin;
    }

    # --------------------------------------------------------
    # Proxy timeouts
    # --------------------------------------------------------
    proxy_connect_timeout  60s;
    proxy_read_timeout     300s;
    proxy_send_timeout     60s;

    # --------------------------------------------------------
    # Helper to send CORS preflight responses
    # --------------------------------------------------------
    # Used in each location via: include /etc/nginx/cors.conf;
    # (inlined below per location for compatibility)

    # --------------------------------------------------------
    # Main server: kubi.kontactless.in + localhost aliases
    # --------------------------------------------------------
    server {
        listen 80;
        server_name kubi.kontactless.in localhost kubi.local;

        # Shared proxy headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── CORS headers applied to every response ──────────
        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, X-Requested-With, Origin" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Max-Age           "3600" always;

        # Internal Docker healthcheck
        location /nginx-health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # ── OPTIONS preflight (handle before proxying) ──────
        location / {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin      $cors_origin always;
                add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, X-Requested-With, Origin" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Max-Age           "3600" always;
                add_header Content-Length 0;
                add_header Content-Type  text/plain;
                return 204;
            }

            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $http_upgrade;
        }

        # Auth routes -> backend
        location /auth/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin      $cors_origin always;
                add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, X-Requested-With, Origin" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Max-Age           "3600" always;
                add_header Content-Length 0;
                add_header Content-Type  text/plain;
                return 204;
            }
            proxy_pass http://backend;
        }

        # API routes -> backend
        location /api/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin      $cors_origin always;
                add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, X-Requested-With, Origin" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Max-Age           "3600" always;
                add_header Content-Length 0;
                add_header Content-Type  text/plain;
                return 204;
            }
            proxy_pass http://backend;
        }

        # Agent routes (WebSocket-capable)
        location /agent/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin      $cors_origin always;
                add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, X-Requested-With, Origin" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Content-Length 0;
                add_header Content-Type  text/plain;
                return 204;
            }
            proxy_pass         http://agent;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }

        # Kibana (rewrite strips /kibana prefix)
        location /kibana/ {
            rewrite ^/kibana/(.*)$ /$1 break;
            proxy_pass http://kibana_svc;
        }

        # Next.js HMR WebSocket — long-lived connection
        location /_next/webpack-hmr {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_read_timeout 86400s;
        }

        # Next.js static assets
        location /_next/ {
            proxy_pass http://frontend;
        }
    }

    # --------------------------------------------------------
    # Backend subdomain: backend.kubi.kontactless.in
    # --------------------------------------------------------
    server {
        listen 80;
        server_name backend.kubi.kontactless.in;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, X-Requested-With, Origin" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Max-Age           "3600" always;

        location / {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin      $cors_origin always;
                add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, X-Requested-With, Origin" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Content-Length 0;
                add_header Content-Type  text/plain;
                return 204;
            }
            proxy_pass http://backend;
        }
    }

    # --------------------------------------------------------
    # Agent subdomain: agent.kubi.kontactless.in
    # --------------------------------------------------------
    server {
        listen 80;
        server_name agent.kubi.kontactless.in;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, X-Requested-With, Origin" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Max-Age           "3600" always;

        location / {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin      $cors_origin always;
                add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, X-Requested-With, Origin" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Content-Length 0;
                add_header Content-Type  text/plain;
                return 204;
            }
            proxy_pass         http://agent;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }
}
