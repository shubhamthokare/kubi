
# ============================================================
# Kubi Local Dev — Docker Compose
#
# This replaces the Minikube Ingress controller with a local
# nginx container that proxies to your running services.
#
# Usage:
#   docker compose up -d
#   docker compose down
#   docker compose logs -f nginx
# ============================================================

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: kubi-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    # extra_hosts makes host.docker.internal resolve on Linux too
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
