# ==============================================================================
# Ansible Playbook: GKE Bootstrap and ArgoCD GitOps Setup
# ==============================================================================

- name: Bootstrap GKE Cluster with ArgoCD
  hosts: gke_bootstrap
  gather_facts: false

  tasks:
    # ──────────────────────────────────────────────────────────────────────────
    # 1. Verification of Kubernetes Connection
    # ──────────────────────────────────────────────────────────────────────────
    - name: Verify GKE kubectl cluster connectivity
      command: kubectl cluster-info
      register: cluster_info
      changed_when: false
      failed_when: "'Kubernetes control plane' not in cluster_info.stdout"

    - name: Output GKE Cluster Info
      debug:
        msg: "Connected successfully to: {{ cluster_info.stdout.split('\n')[0] }}"

    # ──────────────────────────────────────────────────────────────────────────
    # 2. Namespace Creation
    # ──────────────────────────────────────────────────────────────────────────
    - name: Ensure namespace 'argocd' exists
      kubernetes.core.k8s:
        name: argocd
        api_version: v1
        kind: Namespace
        state: present
      ignore_errors: true # Fallback to shell if kubernetes.core collection is not installed
      register: k8s_ns_module

    - name: Namespace 'argocd' fallback shell creation
      command: kubectl create namespace argocd
      when: k8s_ns_module is failed
      ignore_errors: true
      changed_when: false

    # ──────────────────────────────────────────────────────────────────────────
    # 3. ArgoCD Manifests Deployment
    # ──────────────────────────────────────────────────────────────────────────
    - name: Deploy ArgoCD official stable community manifests
      command: kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
      register: argocd_deploy
      changed_when: "'created' in argocd_deploy.stdout or 'configured' in argocd_deploy.stdout"

    # ──────────────────────────────────────────────────────────────────────────
    # 4. Wait for ArgoCD server components to become healthy
    # ──────────────────────────────────────────────────────────────────────────
    - name: Wait for ArgoCD CRDs and deployments to spin up
      command: kubectl wait --namespace argocd --for=condition=available --timeout=300s deployment/argocd-server
      changed_when: false

    # ──────────────────────────────────────────────────────────────────────────
    # 5. ArgoCD Application Seeding (GitOps initialization)
    # ──────────────────────────────────────────────────────────────────────────
    - name: Seed primary Kubi GitOps application manifest
      command: kubectl apply -n argocd -f ../argocd/application.yaml
      register: gitops_app
      changed_when: "'created' in gitops_app.stdout or 'configured' in gitops_app.stdout"

    - name: Log Successful Deployment
      debug:
        msg: "GKE Cluster successfully bootstrapped. ArgoCD GitOps has been initialized under the application 'kubi-gitops'."
