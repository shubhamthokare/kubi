apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubi.fullname" . }}-secrets
  namespace: {{ .Values.namespace | default .Release.Namespace }}
type: Opaque
stringData:
  # ── Database ───────────────────────────────────────────────────────
  DB_PASSWORD: {{ .Values.backend.env.dbPassword | quote }}
  
  # ── Authentication & JWT ───────────────────────────────────────────
  JWT_SECRET_KEY: {{ .Values.backend.env.jwtSecretKey | quote }}
  
  # ── Email Service ──────────────────────────────────────────────────
  RESEND_API_KEY: {{ .Values.backend.env.resendApiKey | quote }}
  
  # ── AI / LLM Services ──────────────────────────────────────────────
  GEMINI_API_KEY: {{ .Values.backend.env.geminiApiKey | quote }}
  
  # ── GitLab Integration ────────────────────────────────────────────
  GITLAB_TOKEN: {{ .Values.backend.env.gitlabToken | quote }}
  
  # ── SSO / OAuth ────────────────────────────────────────────────────
  GOOGLE_CLIENT_ID: {{ .Values.backend.env.googleClientId | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.backend.env.googleClientSecret | quote }}
  GITHUB_CLIENT_ID: {{ .Values.backend.env.githubClientId | quote }}
  GITHUB_CLIENT_SECRET: {{ .Values.backend.env.githubClientSecret | quote }}
  GITLAB_CLIENT_ID: {{ .Values.backend.env.gitlabClientId | quote }}
  GITLAB_CLIENT_SECRET: {{ .Values.backend.env.gitlabClientSecret | quote }}
  SSO_CLIENT_ID: {{ .Values.backend.env.ssoClientId | quote }}
  SSO_CLIENT_SECRET: {{ .Values.backend.env.ssoClientSecret | quote }}
  
  # ── Observability / Tracing (Arize) ────────────────────────────────
  ARIZE_SPACE_ID: {{ .Values.backend.env.arizeSpaceId | quote }}
  ARIZE_API_KEY: {{ .Values.backend.env.arizeApiKey | quote }}
  
  # ── GCP Configuration ──────────────────────────────────────────────
  GCP_PROJECT_ID: {{ .Values.backend.env.gcpProjectId | quote }}
  GCP_REGION: {{ .Values.backend.env.gcpRegion | quote }}
