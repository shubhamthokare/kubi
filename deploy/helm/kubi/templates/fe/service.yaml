apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubi.fullname" . }}-frontend-service
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "kubi.labels" . | nindent 4 }}
    component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "kubi.selectorLabels" . | nindent 4 }}
    component: frontend
