---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-pvc
  namespace: kubi
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
  namespace: kubi
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: elasticsearch
  name: elasticsearch
  namespace: kubi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
      - env:
        - name: discovery.type
          value: single-node
        - name: xpack.security.enabled
          value: "false"
        - name: xpack.security.http.ssl.enabled
          value: "false"
        - name: ES_JAVA_OPTS
          value: -Xms512m -Xmx512m
        - name: cluster.name
          value: kubi-es
        - name: node.name
          value: kubi-es-node
        - name: bootstrap.memory_lock
          value: "false"
        image: docker.elastic.co/elasticsearch/elasticsearch:8.13.2
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /_cluster/health
            port: 9200
          initialDelaySeconds: 60
          periodSeconds: 20
        name: elasticsearch
        ports:
        - containerPort: 9200
          name: http
        - containerPort: 9300
          name: transport
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /_cluster/health
            port: 9200
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          limits:
            cpu: 1000m
            memory: 1.5Gi
          requests:
            cpu: 50m
            memory: 512Mi
        volumeMounts:
        - mountPath: /usr/share/elasticsearch/data
          name: es-data
      initContainers:
      - command:
        - sh
        - -c
        - chown -R 1000:1000 /usr/share/elasticsearch/data
        image: busybox
        name: fix-permissions
        volumeMounts:
        - mountPath: /usr/share/elasticsearch/data
          name: es-data
      volumes:
      - name: es-data
        persistentVolumeClaim:
          claimName: elasticsearch-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: kubi-agent
  name: kubi-agent
  namespace: kubi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubi-agent
  template:
    metadata:
      labels:
        app: kubi-agent
    spec:
      containers:
      - env:
        - name: ENVIRONMENT
          value: production
        - name: ARIZE_SPACE_ID
          valueFrom:
            secretKeyRef:
              key: ARIZE_SPACE_ID
              name: kubi-secrets
              optional: true
        - name: ARIZE_API_KEY
          valueFrom:
            secretKeyRef:
              key: ARIZE_API_KEY
              name: kubi-secrets
              optional: true
        - name: ARIZE_PROJECT_NAME
          value: kubi-prod-agent
        envFrom:
        - configMapRef:
            name: kubi-agent-config
        image: asia-south1-docker.pkg.dev/stone-fortress-338918/kubi-repo/kubi-agent:main-a0aa7f8b
        imagePullPolicy: IfNotPresent
        name: agent
        ports:
        - containerPort: 8000
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 100Mi
      serviceAccountName: kubi-agent-sa
---
