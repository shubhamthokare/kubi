services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: kubi-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - kubi-network
    healthcheck:
      test: curl -s http://localhost:9200 >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: kubi-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - kubi-network
    healthcheck:
      test: curl -s http://localhost:5601 >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:latest
    container_name: kubi-mongodb
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - kubi-network

  be:
    image: kubi-backend:latest
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
    container_name: kubi-backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=${DATABASE_NAME:-kubi}
      - AGENT_URL=${DOCKER_AGENT_URL:-http://agent:8080}
      - BACKEND_URL=${BACKEND_URL:-http://backend.kubi.kontactless.in}
      - FRONTEND_URL=${FRONTEND_URL:-http://kubi.kontactless.in}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ELASTICSEARCH_HOST=http://elasticsearch:9200
      - ELASTICSEARCH_INDEX=${ELASTICSEARCH_INDEX:-kubi-incidents}
      - ELASTICSEARCH_INDEX_LOGS=${ELASTICSEARCH_INDEX_LOGS:-kubi-pod-logs}
      - ELASTICSEARCH_INDEX_EVENTS=${ELASTICSEARCH_INDEX_EVENTS:-kubi-events}
      - ELASTICSEARCH_INDEX_RCA=${ELASTICSEARCH_INDEX_RCA:-kubi-rca}
      - ELASTICSEARCH_INDEX_REMEDIATION=${ELASTICSEARCH_INDEX_REMEDIATION:-kubi-remediation}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000,http://kubi.kontactless.in,http://backend.kubi.kontactless.in,http://agent.kubi.kontactless.in}
      - ENVIRONMENT=${ENVIRONMENT:-local}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-auto}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-no-reply@kubi.ai}
      - SMTP_HOST=${SMTP_HOST:-smtp.resend.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USERNAME=${SMTP_USERNAME:-resend}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_USE_SSL=${SMTP_USE_SSL:-true}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-false}
      - EMAIL_SENDER_POOL=${EMAIL_SENDER_POOL:-}
      - EMAIL_SENDER_MONTHLY_LIMIT=${EMAIL_SENDER_MONTHLY_LIMIT:-3000}
      - EMAIL_SENDER_SWITCH_AFTER=${EMAIL_SENDER_SWITCH_AFTER:-2900}
      - EMAIL_SENDER_USAGE_COLLECTION=${EMAIL_SENDER_USAGE_COLLECTION:-email_sender_usage}
      - ARIZE_SPACE_ID=${ARIZE_SPACE_ID:-}
      - ARIZE_API_KEY=${ARIZE_API_KEY:-}
      - ARIZE_PROJECT_NAME=${ARIZE_PROJECT_NAME:-kubi-docker-backend}
      - ARIZE_REQUIRE_DASHBOARD=${ARIZE_REQUIRE_DASHBOARD:-false}
      - PHOENIX_COLLECTOR_ENDPOINT=${PHOENIX_COLLECTOR_ENDPOINT:-}
    depends_on:
      - mongodb
      - elasticsearch
    networks:
      - kubi-network

  agent:
    image: kubi-agent:latest
    build:
      context: ../../apps/agent
      dockerfile: Dockerfile
    container_name: kubi-agent
    ports:
      - "8080:8080"
    environment:
      - KUBI_BACKEND_URL=${DOCKER_BACKEND_URL:-http://be:8000}
      - CLUSTER_ID=${CLUSTER_ID:-local-docker}
      - TARGET_NAMESPACE=${TARGET_NAMESPACE:-*}
      - SCAN_INTERVAL=${SCAN_INTERVAL:-30}
      - ENVIRONMENT=${ENVIRONMENT:-local}
      - ARIZE_SPACE_ID=${ARIZE_SPACE_ID:-}
      - ARIZE_API_KEY=${ARIZE_API_KEY:-}
      - ARIZE_PROJECT_NAME=${ARIZE_AGENT_PROJECT_NAME:-kubi-docker-agent}
      - ARIZE_REQUIRE_DASHBOARD=${ARIZE_REQUIRE_DASHBOARD:-false}
      - PHOENIX_COLLECTOR_ENDPOINT=${PHOENIX_COLLECTOR_ENDPOINT:-}
    volumes:
      - C:\Users\shubh\.minikube:/root/.minikube:ro
      - ../kubeconfig:/root/.kube/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - be
    networks:
      - kubi-network

  fe:
    image: kubi-frontend:latest
    build:
      context: ../../apps/frontend
      dockerfile: Dockerfile
    container_name: kubi-frontend
    ports:
      - "3000:80"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://backend.kubi.kontactless.in/api}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://kubi.kontactless.in}
      - NEXT_PUBLIC_AGENT_URL=${NEXT_PUBLIC_AGENT_URL:-http://agent.kubi.kontactless.in}
      - BACKEND_URL=${DOCKER_BACKEND_URL:-http://be:8000}
    depends_on:
      - be
    networks:
      - kubi-network
  
  playwright:
    build: ../../
    container_name: kubeguard-playwright

    working_dir: /app

    volumes:
      - ../../:/app

    environment:
      - KUBECONFIG_CONTENT=${KUBECONFIG_CONTENT:-}
      - APP_URL=${APP_URL:-http://host.docker.internal:3000}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    network_mode: host

    command: npx playwright test --headed

volumes:
  mongo-data:
  elasticsearch-data:

networks:
  kubi-network:
    name: kubi-network
