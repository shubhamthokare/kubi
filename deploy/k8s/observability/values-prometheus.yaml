prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelix: false
    podMonitorSelectorNilUsesHelix: false
    retention: 7d

grafana:
  adminPassword: "admin"
  persistence:
    enabled: true
    size: 5Gi
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
