apiVersion: v1
kind: ConfigMap
metadata:
  name: kubi-config
  namespace: kubi
data:
  # Database
  MONGODB_URL: "mongodb://mongodb-service:27017"
  DATABASE_NAME: "kubi"
  # Service URLs (in-cluster DNS)
  BACKEND_URL: "https://backend.kubi.kontactless.in"
  AGENT_URL: "https://agent.kubi.kontactless.in"
  FRONTEND_URL: "https://kubi.kontactless.in"
  DOMAIN: "kubi.kontactless.in"
  DOMAIN_NAME: "kubi.kontactless.in"
  # Elasticsearch (in-cluster, security disabled for dev)
  ELASTICSEARCH_HOST: "http://elasticsearch-service:9200"
  ELASTICSEARCH_INDEX: "kubi-incidents"
  ELASTICSEARCH_INDEX_LOGS: "kubi-pod-logs"
  ELASTICSEARCH_INDEX_EVENTS: "kubi-events"
  ELASTICSEARCH_INDEX_RCA: "kubi-rca"
  ELASTICSEARCH_INDEX_REMEDIATION: "kubi-remediation"
  ELASTICSEARCH_USERNAME: ""
  ELASTICSEARCH_PASSWORD: ""
  ELASTICSEARCH_SHARDS: "1"
  ELASTICSEARCH_REPLICAS: "0"
  # CORS — allow all local + tunnel origins
  CORS_ORIGINS: "http://localhost:3000,http://localhost:8000,http://127.0.0.1:3000,http://127.0.0.1:49262,http://192.168.49.2:30001"
