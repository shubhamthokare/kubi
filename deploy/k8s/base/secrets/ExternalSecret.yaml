apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kubi-external-secrets
  namespace: kubi
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: kubi-secrets
    creationPolicy: Owner
  data:
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: GEMINI_API_KEY
    - secretKey: GITLAB_TOKEN
      remoteRef:
        key: GITLAB_PRIVATE_TOKEN
