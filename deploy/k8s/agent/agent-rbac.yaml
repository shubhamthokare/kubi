apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubi-agent-sa
  namespace: kubi
  labels:
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: kubi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubi-agent-role
  labels:
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: kubi
rules:
  # Read-only: cluster state observation
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/status", "events", "nodes", "namespaces", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  # Write: pod-level remediation for standalone pods
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "patch", "update"]
  # Execute: in-pod diagnostics (e.g. checking process state)
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # Read-only: workload state
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  # Write: remediation execution (restart, rollback, scale)
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubi-agent-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubi-agent-role
subjects:
  - kind: ServiceAccount
    name: kubi-agent-sa
    namespace: kubi
