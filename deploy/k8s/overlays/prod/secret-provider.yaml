apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: kubi-all-secrets
  namespace: kubi
spec:
  provider: gcp
  # List of secret objects to create in Kubernetes from GCP Secret Manager
  secretObjects:
  - secretName: kubi-all-secrets
    type: Opaque
    data:
    - objectName: GCP_PROJECT_ID
    - objectName: GCP_REGION
    - objectName: DB_PASSWORD
    - objectName: RESEND_API_KEY
    - objectName: JWT_SECRET_KEY
    - objectName: GEMINI_API_KEY
    - objectName: GITLAB_TOKEN
    - objectName: ARIZE_SPACE_ID
    - objectName: ARIZE_API_KEY
    - objectName: ARIZE_PROJECT_NAME
    - objectName: SSO_CLIENT_ID
    - objectName: SSO_CLIENT_SECRET
    - objectName: MONGODB_URL
    - objectName: DATABASE_NAME
    - objectName: AGENT_URL
    - objectName: CORS_ORIGINS
    - objectName: DOMAIN_NAME
    - objectName: ELASTICSEARCH_HOST
    - objectName: ELASTICSEARCH_INDEX
    - objectName: ELASTICSEARCH_INDEX_LOGS
    - objectName: ELASTICSEARCH_INDEX_EVENTS
    - objectName: ELASTICSEARCH_INDEX_RCA
    - objectName: ELASTICSEARCH_INDEX_REMEDIATION
    - objectName: ELASTICSEARCH_USERNAME
    - objectName: ELASTICSEARCH_PASSWORD
    - objectName: DOMAIN
  # Parameters for GCP provider – list each secret as a resource path
  parameters:
    secrets: |
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/DB_PASSWORD"
        version: "latest"
        key: "DB_PASSWORD"
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/RESEND_API_KEY"
        version: "latest"
        key: "RESEND_API_KEY"
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/JWT_SECRET_KEY"
        version: "latest"
        key: "JWT_SECRET_KEY"
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/GEMINI_API_KEY"
        version: "latest"
        key: "GEMINI_API_KEY"
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/GITLAB_TOKEN"
        version: "latest"
        key: "GITLAB_TOKEN"
      # add other secrets similarly if needed
