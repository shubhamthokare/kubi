apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubi-backend-role
  labels:
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: kubi
rules:
  # Core cluster state — read-only (backend observes, never mutates)
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "nodes", "namespaces", "pods/status", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  # Workload state — read-only
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
