apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubi-backend
  namespace: kubi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubi-backend
  template:
    metadata:
      labels:
        app: kubi-backend
    spec:
      serviceAccountName: kubi-backend-sa
      containers:
      - name: backend
        image: kubi-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        # ── Secrets ──────────────────────────────────────────────
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kubi-secrets
              key: DB_PASSWORD
        - name: RESEND_API_KEY
          valueFrom:
            secretKeyRef:
              name: kubi-secrets
              key: RESEND_API_KEY
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kubi-secrets
              key: SMTP_PASSWORD
              optional: true
        - name: EMAIL_SENDER_POOL
          valueFrom:
            secretKeyRef:
              name: kubi-secrets
              key: EMAIL_SENDER_POOL
              optional: true
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: kubi-secrets
              key: JWT_SECRET_KEY
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: kubi-secrets
              key: GEMINI_API_KEY
        - name: GITLAB_TOKEN
          valueFrom:
            secretKeyRef:
              name: kubi-secrets
              key: GITLAB_TOKEN
        # ── Arize Tracing ─────────────────────────────────────────
        - name: ENVIRONMENT
          value: "production"
        - name: ARIZE_SPACE_ID
          valueFrom:
            secretKeyRef:
              name: kubi-secrets
              key: ARIZE_SPACE_ID
              optional: true
        - name: ARIZE_API_KEY
          valueFrom:
            secretKeyRef:
              name: kubi-secrets
              key: ARIZE_API_KEY
              optional: true
        - name: ARIZE_PROJECT_NAME
          value: "kubi-prod-backend"
        - name: SSO_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: kubi-secrets
              key: SSO_CLIENT_ID
        - name: SSO_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: kubi-secrets
              key: SSO_CLIENT_SECRET
        # ── Config values from ConfigMap ──────────────────────────
        - name: MONGODB_URL
          valueFrom:
            configMapKeyRef:
              name: kubi-config
              key: MONGODB_URL
        - name: DATABASE_NAME
          valueFrom:
            configMapKeyRef:
              name: kubi-config
              key: DATABASE_NAME
        - name: AGENT_URL
          valueFrom:
            configMapKeyRef:
              name: kubi-config
              key: AGENT_URL
        - name: CORS_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: kubi-config
              key: CORS_ORIGINS
        # ── Elasticsearch ─────────────────────────────────────────
        - name: EMAIL_PROVIDER
          valueFrom:
            configMapKeyRef:
              name: kubi-config
              key: EMAIL_PROVIDER
        - name: EMAIL_FROM
          valueFrom:
            configMapKeyRef:
              name: kubi-config
              key: EMAIL_FROM
        - name: SMTP_HOST
          valueFrom:
            configMapKeyRef:
              name: kubi-config
              key: SMTP_HOST
        - name: SMTP_PORT
          valueFrom:
            configMapKeyRef:
              name: kubi-config
              key: SMTP_PORT
        - name: SMTP_USERNAME
          valueFrom:
            configMapKeyRef:
              name: kubi-config
              key: SMTP_USERNAME
        - name: SMTP_USE_SSL
          valueFrom:
            configMapKeyRef:
              name: kubi-config
              key: SMTP_USE_SSL
        - name: SMTP_USE_TLS
          valueFrom:
            configMapKeyRef:
              name: kubi-config
              key: SMTP_USE_TLS
        - name: EMAIL_SENDER_MONTHLY_LIMIT
          valueFrom:
            configMapKeyRef:
              name: kubi-config
              key: EMAIL_SENDER_MONTHLY_LIMIT
        - name: EMAIL_SENDER_SWITCH_AFTER
          valueFrom:
            configMapKeyRef:
              name: kubi-config
              key: EMAIL_SENDER_SWITCH_AFTER
        - name: EMAIL_SENDER_USAGE_COLLECTION
          valueFrom:
            configMapKeyRef:
              name: kubi-config
              key: EMAIL_SENDER_USAGE_COLLECTION
        - name: ELASTICSEARCH_HOST
          valueFrom:
            configMapKeyRef:
              name: kubi-config
              key: ELASTICSEARCH_HOST
        - name: ELASTICSEARCH_INDEX
          valueFrom:
            configMapKeyRef:
              name: kubi-config
              key: ELASTICSEARCH_INDEX
        - name: ELASTICSEARCH_INDEX_LOGS
          valueFrom:
            configMapKeyRef:
              name: kubi-config
              key: ELASTICSEARCH_INDEX_LOGS
        - name: ELASTICSEARCH_INDEX_EVENTS
          valueFrom:
            configMapKeyRef:
              name: kubi-config
              key: ELASTICSEARCH_INDEX_EVENTS
        - name: ELASTICSEARCH_INDEX_RCA
          valueFrom:
            configMapKeyRef:
              name: kubi-config
              key: ELASTICSEARCH_INDEX_RCA
        - name: ELASTICSEARCH_INDEX_REMEDIATION
          valueFrom:
            configMapKeyRef:
              name: kubi-config
              key: ELASTICSEARCH_INDEX_REMEDIATION
        # Auth — empty by default for dev (security disabled in ES)
        - name: ELASTICSEARCH_USERNAME
          value: ""
        - name: ELASTICSEARCH_PASSWORD
          value: ""
        # Global Domain
        - name: DOMAIN_NAME
          valueFrom:
            configMapKeyRef:
              name: kubi-config
              key: DOMAIN_NAME
        - name: DOMAIN
          valueFrom:
            configMapKeyRef:
              name: kubi-config
              key: DOMAIN
