# ==============================================================================
# Kubi AI - Unified GitLab CI/CD Monorepo Pipeline
# Co-authored by Antigravity (Google DeepMind)
# ==============================================================================

stages:
  - test
  - build
  - gitops

# Cache dependencies across jobs for faster pipeline runs
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - apps/frontend/node_modules/
    - .pip-cache/

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  # GCP Configuration for Artifact Registry (Can be overridden in GitLab CI/CD Variables)
  GCP_PROJECT_ID: "PROJECT_ID"
  # Docker Image Tagging Scheme using Google Artifact Registry
  BACKEND_IMAGE: "asia-south1-docker.pkg.dev/$GCP_PROJECT_ID/kubi-repo/kubi-backend:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
  FRONTEND_IMAGE: "asia-south1-docker.pkg.dev/$GCP_PROJECT_ID/kubi-repo/kubi-frontend:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
  AGENT_IMAGE: "asia-south1-docker.pkg.dev/$GCP_PROJECT_ID/kubi-repo/kubi-agent:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"

# ──────────────────────────────────────────────────────────────────────────────
# 🧪 Stage: Test (Continuous Integration)
# ──────────────────────────────────────────────────────────────────────────────

test:backend:
  stage: test
  image: python:3.10-slim
  script:
    - "cd apps/backend"
    - "pip install --default-timeout=100 --only-binary :all: -r requirements.txt"
    - "PYTHONPATH=. pytest tests/ -v"
  only:
    changes:
      - apps/backend/**/*
      - .gitlab-ci.yml

test:agent:
  stage: test
  image: python:3.10-slim
  script:
    - "cd apps/agent"
    - "pip install --default-timeout=100 --only-binary :all: -r requirements.txt"
    - 'if [ -d "tests" ]; then PYTHONPATH=. python -m unittest discover -s tests -v; else echo "No tests found for agent"; fi'
  only:
    changes:
      - apps/agent/**/*
      - .gitlab-ci.yml

test:frontend:
  stage: test
  image: node:20-alpine
  script:
    - cd apps/frontend
    - npm install
    - npm run lint
  only:
    changes:
      - apps/frontend/**/*
      - .gitlab-ci.yml

sonarcloud:
  stage: test
  image: sonarsource/sonar-scanner-cli:latest
  needs:
    - job: test:backend
      optional: true
    - job: test:frontend
      optional: true
    - job: test:agent
      optional: true
  script:
    - sonar-scanner -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.login=$SONAR_TOKEN
# ──────────────────────────────────────────────────────────────────────────────
# 📦 Stage: Build (Docker Containerization)
# ──────────────────────────────────────────────────────────────────────────────

build:backend:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - |
      if [ -f "$GCP_SERVICE_KEY" ]; then
        KEY_CONTENT=$(cat "$GCP_SERVICE_KEY")
      elif [ -n "$GCP_SERVICE_KEY" ]; then
        KEY_CONTENT="$GCP_SERVICE_KEY"
      else
        echo "❌ Error: GCP_SERVICE_KEY is empty or not defined. Configure it in GitLab Settings > CI/CD > Variables."
        exit 1
      fi
      if [[ "$KEY_CONTENT" != "{"* ]]; then
        echo "🔓 Detecting Base64 encoded key, decoding..."
        DECODED_KEY=$(echo "$KEY_CONTENT" | base64 -d 2>/dev/null || echo "$KEY_CONTENT" | base64 --decode 2>/dev/null || echo "")
        if [[ "$DECODED_KEY" == "{"* ]]; then
          KEY_CONTENT="$DECODED_KEY"
        else
          echo "⚠️ Warning: Key does not start with '{' even after base64 decoding attempt."
        fi
      fi
      echo "$KEY_CONTENT" | docker login -u _json_key --password-stdin https://asia-south1-docker.pkg.dev
    - docker build -t "$BACKEND_IMAGE" apps/backend/
    - docker push "$BACKEND_IMAGE"
  only:
    changes:
      - apps/backend/**/*
      - .gitlab-ci.yml

build:frontend:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - |
      if [ -f "$GCP_SERVICE_KEY" ]; then
        KEY_CONTENT=$(cat "$GCP_SERVICE_KEY")
      elif [ -n "$GCP_SERVICE_KEY" ]; then
        KEY_CONTENT="$GCP_SERVICE_KEY"
      else
        echo "❌ Error: GCP_SERVICE_KEY is empty or not defined. Configure it in GitLab Settings > CI/CD > Variables."
        exit 1
      fi
      if [[ "$KEY_CONTENT" != "{"* ]]; then
        echo "🔓 Detecting Base64 encoded key, decoding..."
        DECODED_KEY=$(echo "$KEY_CONTENT" | base64 -d 2>/dev/null || echo "$KEY_CONTENT" | base64 --decode 2>/dev/null || echo "")
        if [[ "$DECODED_KEY" == "{"* ]]; then
          KEY_CONTENT="$DECODED_KEY"
        else
          echo "⚠️ Warning: Key does not start with '{' even after base64 decoding attempt."
        fi
      fi
      echo "$KEY_CONTENT" | docker login -u _json_key --password-stdin https://asia-south1-docker.pkg.dev
    - docker build -t "$FRONTEND_IMAGE" --build-arg NEXT_PUBLIC_API_URL="http://kubi-backend-service:8000" apps/frontend/
    - docker push "$FRONTEND_IMAGE"
  only:
    changes:
      - apps/frontend/**/*
      - .gitlab-ci.yml

build:agent:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - |
      if [ -f "$GCP_SERVICE_KEY" ]; then
        KEY_CONTENT=$(cat "$GCP_SERVICE_KEY")
      elif [ -n "$GCP_SERVICE_KEY" ]; then
        KEY_CONTENT="$GCP_SERVICE_KEY"
      else
        echo "❌ Error: GCP_SERVICE_KEY is empty or not defined. Configure it in GitLab Settings > CI/CD > Variables."
        exit 1
      fi
      if [[ "$KEY_CONTENT" != "{"* ]]; then
        echo "🔓 Detecting Base64 encoded key, decoding..."
        DECODED_KEY=$(echo "$KEY_CONTENT" | base64 -d 2>/dev/null || echo "$KEY_CONTENT" | base64 --decode 2>/dev/null || echo "")
        if [[ "$DECODED_KEY" == "{"* ]]; then
          KEY_CONTENT="$DECODED_KEY"
        else
          echo "⚠️ Warning: Key does not start with '{' even after base64 decoding attempt."
        fi
      fi
      echo "$KEY_CONTENT" | docker login -u _json_key --password-stdin https://asia-south1-docker.pkg.dev
    - docker build -t "$AGENT_IMAGE" apps/agent/
    - docker push "$AGENT_IMAGE"
  only:
    changes:
      - apps/agent/**/*
      - .gitlab-ci.yml

# ──────────────────────────────────────────────────────────────────────────────
# 🔄 Stage: GitOps (Automated Image Tag Reconciliation for ArgoCD)
# ──────────────────────────────────────────────────────────────────────────────

update:manifests:
  stage: gitops
  image: line/kubectl-kustomize:latest
  script:
    - "if command -v apk >/dev/null; then apk add --no-cache git; elif command -v apt-get >/dev/null; then apt-get update && apt-get install -y git; fi"
    - git config --global user.email "${GITOPS_EMAIL:-$GITLAB_USER_EMAIL}"
    - git config --global user.name "${GITOPS_NAME:-$GITLAB_USER_NAME}"
    # Ensure remote changes are integrated first
    - git checkout main
    - git pull origin main
    # Update image tags dynamically in the Kustomize config
    - cd deploy/k8s
    - kustomize edit set image kubi-backend="$BACKEND_IMAGE"
    - kustomize edit set image kubi-frontend="$FRONTEND_IMAGE"
    - kustomize edit set image kubi-agent="$AGENT_IMAGE"
    # Hydrate Kustomize manifests into a single flat file for GitLab Agent pull GitOps
    - mkdir -p ../manifests
    - kustomize build . -o ../manifests/hydrated.yaml
    # Commit and push changes back to git (skipping CI loop)
    - git add kustomization.yaml ../manifests/hydrated.yaml
    - git commit -m "gitops:auto-promote and hydrate image tags to commit $CI_COMMIT_SHORT_SHA [skip ci]" || echo "No image tag changes detected"
    - "git push https://oauth2:${GL_ACCESS_TOKEN}@gitlab.com/kubi-agent/kubi.git HEAD:main"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $GL_ACCESS_TOKEN'
