version: "3.9"
services:
  # -------------------------------------------------
  # Frontend (Next.js)
  # -------------------------------------------------
  frontend:
    image: node:20
    working_dir: /app
    command: npm run dev
    ports:
      - "3000:3000"               # host -> container
    volumes:
      - ./apps/frontend:/app      # live source mounting
    environment:
      - NODE_ENV=development

  # -------------------------------------------------
  # Backend (FastAPI/Uvicorn)
  # -------------------------------------------------
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./apps/backend/.env
    depends_on:
      - mongodb

  # -------------------------------------------------
  # Agent (Python service)
  # -------------------------------------------------
  agent:
    build:
      context: ./apps/agent
      dockerfile: Dockerfile
    ports:
      - "8001:8000"               # expose on host port 8001 (internal container still 8000)
    env_file:
      - ./apps/agent/.env
    depends_on:
      - backend

  # -------------------------------------------------
  # MongoDB (local storage for backend)
  # -------------------------------------------------
  mongodb:
    image: mongo:6
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db

  # -------------------------------------------------
  # Playwright test runner (Docker image from deploy/playwright)
  # -------------------------------------------------
  playwright:
    build:
      context: ./deploy/playwright
      dockerfile: Dockerfile
    depends_on:
      - frontend
      - backend
      - agent
    env_file:
      - ./deploy/playwright/.env
    # No ports – test runs inside this container.

volumes:
  mongo-data:
