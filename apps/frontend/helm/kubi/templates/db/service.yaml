{{- if .Values.mongodb.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubi.fullname" . }}-mongodb-service
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "kubi.labels" . | nindent 4 }}
    component: database
spec:
  selector:
    {{- include "kubi.selectorLabels" . | nindent 4 }}
    component: database
  ports:
    - protocol: TCP
      port: {{ .Values.mongodb.service.port }}
      targetPort: {{ .Values.mongodb.service.port }}
{{- end }}
