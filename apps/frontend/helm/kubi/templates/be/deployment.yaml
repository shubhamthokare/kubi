apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubi.fullname" . }}-backend
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "kubi.labels" . | nindent 4 }}
    component: backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kubi.selectorLabels" . | nindent 6 }}
      component: backend
  template:
    metadata:
      labels:
        {{- include "kubi.selectorLabels" . | nindent 8 }}
        component: backend
    spec:
      serviceAccountName: {{ include "kubi.fullname" . }}-backend-sa
      containers:
      - name: backend
        image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
        env:
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "kubi.fullname" . }}-secrets
              key: GEMINI_API_KEY
        - name: MONGODB_URL
          valueFrom:
            configMapKeyRef:
              name: {{ include "kubi.fullname" . }}-config
              key: MONGODB_URL
        - name: DATABASE_NAME
          valueFrom:
            configMapKeyRef:
              name: {{ include "kubi.fullname" . }}-config
              key: DATABASE_NAME
        ports:
        - containerPort: {{ .Values.backend.service.port }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
